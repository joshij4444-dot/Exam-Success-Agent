kind = "web"
previewPath = "/"
title = "ExamCrack AI Coach"
version = "1.0.0"
id = "artifacts/exam-coach"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19859

[services.development]
run = "pnpm --filter @workspace/exam-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/exam-coach", "run", "build" ]
publicDir = "artifacts/exam-coach/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19859"
BASE_PATH = "/"
